name: Update profile README with recent contributions

on:
  schedule:
    - cron: '0 * * * *'  # runs at the top of every hour
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install Python deps
        run: python -m pip install --upgrade pip && pip install requests python-dateutil
      - name: Run README updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: "AmmarYasser455"
        run: python .github/scripts/update_readme.py
      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add README.md
            git commit -m "chore: update profile README with recent contributions"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
